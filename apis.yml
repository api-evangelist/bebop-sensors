name: BeBop Sensors
description: BeBop Sensors was a Berkeley, California smart-fabric sensor company founded in 2014 that
  designed and manufactured flexible, fabric-based pressure and touch sensors for OEMs across robotics,
  medical devices, automotive interiors, and virtual reality. Its best known products were haptic VR
  gloves and "intelligent sensing technology" surfaces that turned ordinary materials into multi-touch,
  pressure-sensitive inputs. The company raised a $10M+ Series A led by Bullpen Capital and shipped
  custom sensor hardware paired with bespoke firmware and integration software for enterprise customers.
  BeBop sold engineered hardware under contract rather than a self-serve developer product, and never
  published a public API, developer portal, or SDK. The company is no longer operating and its former
  domain has been repurposed by an unrelated third party.
